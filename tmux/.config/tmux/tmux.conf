## You need to install https://github.com/tmux-plugins/tpm as a package manager

# Fix colors inside tmux
set-option -sa terminal-overrides ",xterm*:Tc"
# Enable mouse support
set -g mouse on

# Review this config
bind -n M-H previous-window
bind -n M-L next-window

# Start windows and panes at 1, not 0.
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Set prefix to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Set vi mode
set-window-option -g mode-keys vi

# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open panes in current directory
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# tmux-sessionizer
bind-key -r f display-popup -E "~/.local/scripts/tmux-sessionizer"
bind-key -r j display-popup -E "~/.local/scripts/tmux-sessionizer"

# cht.sh
bind-key -r i run-shell "tmux neww cht.sh"

# Reload config file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded..."

# send clear screen
bind-key -r l send-key C-l

# <prefix> and p to paste from clipboard
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.config/tmux/plugins/"

set -g @git-worktree-verbose 1

# Configure catppuccin BEFORE loading it
set -g @catppuccin_flavour "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'gianu/tmux-git-worktree'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

# AFTER plugins load
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_session}"

# Window naming
set -g allow-rename off
set -g automatic-rename on
set -g automatic-rename-format "#{b:pane_current_path}"

# Fix: use #W (window name) instead of #T (pane title) for non-current windows
set -g window-status-format "#[fg=#11111b,bg=#{@thm_overlay_2}]#[fg=#181825,reverse]#[none]#I #[fg=#cdd6f4,bg=#{@thm_surface_0}] #W#[fg=#181825,reverse]#[none]"
